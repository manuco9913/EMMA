services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: wavesim
      POSTGRES_USER: wavesim
      POSTGRES_PASSWORD: wavesim
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U wavesim"]
      interval: 5s
      timeout: 5s
      retries: 10

  backend:
    build: ./backend
    depends_on:
      postgres:
        condition: service_healthy
    environment:
      DATABASE_URL: postgresql://wavesim:wavesim@postgres:5432/wavesim
      DATA_DIR: /data
    ports:
      - "8000:8000"
    volumes:
      - simdata:/data
      - ./backend/static:/app/static
    develop:
      watch:
        - action: sync
          path: ./backend
          target: /app

  frontend:
    build: ./frontend
    ports:
      - "80:80"
    depends_on:
      - backend

volumes:
  pgdata:
  simdata:
